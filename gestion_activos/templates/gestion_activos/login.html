<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BuildCorp | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b1c2c; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .card-header { background-color: #ffffff; border-bottom: 3px solid #f39c12; text-align: center; padding: 25px 20px; border-radius: 10px 10px 0 0 !important; }
        .brand { font-weight: 700; color: #0b1c2c; font-size: 1.5rem; letter-spacing: 1px; }
        .brand span { color: #f39c12; }
        input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 5px; }
        label { font-weight: 600; font-size: 0.85rem; color: #495057; }
        .helptext, ul.errorlist { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="brand">Build<span>Corp</span> Enterprise</div>
            <small class="text-muted">Portal de Gestión de Activos</small>
        </div>
        <div class="card-body p-4 bg-light">
            {% if messages %}{% for message in messages %}<div class="alert alert-info text-center small p-2">{{ message }}</div>{% endfor %}{% endif %}
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 fw-bold mt-2" style="color: #0b1c2c;">Iniciar Sesión</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-primary text-decoration-none fw-bold">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</body>
</html>
